name: Opire & Algora Stealth Bounty Runner
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install requests pygithub pydantic pytest

      - name: Run Cloud Worker (Stealth & Quality)
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          SOLANA_WALLET: ${{ secrets.SOLANA_WALLET }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          WORKER_ID: ${{ secrets.WORKER_ID }}
        run: |
          python runner.py || true

      - name: Run Bounty Solver Engine (Algora & Opire + LLM)
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          TELEGRAM_BOT_TOKEN: "8693469191:***"
          TELEGRAM_CHAT_ID: "7572064021"
          WORKER_ID: ${{ secrets.WORKER_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python opire_solver.py || true
